name: GH Actions CI
on:
  push:
    branches:
      - main
      - compute-layer
  pull_request:
    branches:
      - main
      - compute-layer
  schedule:
    # nightly tests, between US and AUS working hours
    - cron: "0 3 * * *"
  workflow_dispatch:

env:
  OE_LICENSE: ${{ github.workspace }}/oe_license.txt

jobs:
  main_tests:
    name: CI (${{ matrix.os }}, env ${{ matrix.environment }})
    runs-on: ${{ matrix.os }}
    strategy:
        fail-fast: true
        matrix:
          os: [macOS-latest, ubuntu-latest]
          environment:
            - py312
            - py312openeye

    steps:
    - uses: actions/checkout@v7

    - name: Set up virtual environment
      uses: prefix-dev/setup-pixi@v0.10.1
      with:
        pixi-version: v0.72.0
        environments: ${{ matrix.environment }}
        frozen: true

    - name: License OpenEye Toolkits
      if: ${{ contains(matrix.environment, 'openeye') }}
      run: |
        echo "${SECRET_OE_LICENSE}" > ${OE_LICENSE}
        pixi run -e ${{ matrix.environment }} python -c "from openeye import oechem; assert oechem.OEChemIsLicensed()"
      env:
        SECRET_OE_LICENSE: ${{ secrets.OE_LICENSE }}


    - name: Run type-checker
      run: pixi run -e ${{ matrix.environment }} run_mypy

    - name: Run tests
      run: pixi run -e ${{ matrix.environment }} run_tests

    - name: codecov
      uses: codecov/codecov-action@v7
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: ./coverage.xml
        verbose: True
