name: GPU-enabled CI
on:
  workflow_dispatch:
  pull_request:
    types:
      - ready_for_review
      - reopened
      - synchronize
    branches:
      - "main"
    paths:
      - "tyff/**"
      - "pixi.toml"
      - ".github/workflows/gpu.yaml"

concurrency:
  # Specific group naming so CI is only cancelled
  # within same PR or on merge to main
  group: ${{ github.ref }}-${{ github.head_ref }}-${{ github.workflow }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash -l {0}

env:
  OE_LICENSE: ${{ github.workspace }}/oe_license.txt

jobs:
  start-aws-runner:
    name: Start AWS runner
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    outputs:
      mapping: ${{ steps.aws-start.outputs.mapping }}
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::649715411074:role/gh-actions-runner-role
          aws-region: us-east-1
      - name: Create cloud runner
        id: aws-start
        uses: omsf/start-aws-gha-runner@v1.4.0
        with:
          aws_image_id: ami-0d5079d9be06933e5
          aws_instance_type: g4dn.xlarge
          # IAM default might be 5 GB?
          aws_root_device_size: 125
          aws_region_name: us-east-1
          aws_home_dir: /home/ubuntu
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
  self-hosted-test:
    name: GPU-based tests (env ${{ matrix.environment }})
    # maybe switch to if: needs.start-aws-runner.result ==  'success'
    # if the condition on start-aws-runner changes
    if: github.event.pull_request.draft == false
    runs-on: self-hosted
    timeout-minutes: 30
    strategy:
        fail-fast: true
        matrix:
          environment:
            - gpu
    needs:
      - start-aws-runner
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Schedule auto-shutdown after 24 hours
        # This is the failsafe if timeout-minutes above fails
        # More info https://github.com/openforcefield/openff-evaluator/issues/740
        run: nohup bash -c 'sleep 86400 && sudo shutdown -h now' > /tmp/auto-shutdown.log 2>&1 &

      - name: Set up virtual environment
        uses: prefix-dev/setup-pixi@v0.11.3
        with:
          environments: ${{ matrix.environment }}
          frozen: true

      - name: License OpenEye Toolkits
        run: |
          echo "${SECRET_OE_LICENSE}" > ${OE_LICENSE}
          pixi run -e ${{ matrix.environment }} python -c "from openeye import oechem; assert oechem.OEChemIsLicensed()"
        env:
          SECRET_OE_LICENSE: ${{ secrets.OE_LICENSE }}

      - name: Run debugging commands
        run: |
            pixi run -e ${{ matrix.environment }} python -m openmm.testInstallation
            pixi run -e ${{ matrix.environment }} python -c "import openmm; print(openmm.Platform.getPluginLoadFailures())"
            pixi run -e ${{ matrix.environment }} python -c "import openmm; openmm.Platform.getPlatformByName('CUDA')"
            nvidia-smi

      - name: Run GPU-based tests
        run: |
            pixi run -e gpu run_gpu_tests

  stop-aws-runner:
    name: Stop AWS runner
    if: always() && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
        id-token: write
        contents: read
    needs:
      - start-aws-runner
      - self-hosted-test
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::649715411074:role/gh-actions-runner-role
          aws-region: us-east-1
      - name: Stop instances
        uses: omsf/stop-aws-gha-runner@v1.0.0
        with:
          instance_mapping: ${{ needs.start-aws-runner.outputs.mapping }}
          aws_region_name: us-east-1
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
