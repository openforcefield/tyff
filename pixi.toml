[workspace]
name = "tyff"
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64"]

[tasks]
run_mypy = "python -m mypy -p 'tyff'"
run_tests = { cmd = "python -m pytest -n logical tyff/_tests", env = { OPENMM_DEFAULT_PLATFORM = "CPU" } }
dev_tests = { cmd = "python -m pytest -s -x --pdb --lf tyff/_tests", env = { OPENMM_DEFAULT_PLATFORM = "CPU" } }

[dependencies]
# conda-only dependencies
openff-toolkit = "*"
pydantic-units = "*"
NNPOps = "*"
# probably optional-ish below here
openff-packmol = "0.1.*"
openff-evaluator-base = "*"
# shims / constraints to help solver
pyarrow = "20.*"
bokeh = "3.9.*"
filelock = "<4"  # parsl stuck on 3.x
sqlalchemy = ">=2.0.14,<2.1.0"
datasets = "4.*"  # can probably remove when pyarrow >20

[pypi-dependencies]
pydantic = "*"
datasets = "*"
pyyaml = "*"
numpy = "*"
setuptools_scm = "*"
openmm = "*"
symengine = "*"
rdkit = "*"
sqlmodel = "*"
rdkit-stubs = "*"
parsl = "==2026.*"
rich = "*"
tyff = { path = ".", editable = true }
# probably optional-ish below here
jupyter = "*"
nbconvert = "*"
tensorboard = "*"
tensorboardx = "*"
uncertainties = "*"
matplotlib = "*"
panel = "*"

[environments]
py312amber = ["py312", "ambertools", "test", "typing"]
py312openeye = ["py312", "openeye", "packmol", "test", "typing"]
dev = ["py312", "openeye", "test", "typing", "dev"]
hpc3 = ["py312", "openeye", "cu130", "packmol"]

[feature.dev.dependencies]
# these PyPI builds are marked as pre-release only for some reason
pymol-open-source = "*"

[feature.dev.pypi-dependencies]
pre-commit = "*"
jupyterlab = "*"
ipython = "*"
ipdb = "*"
ruff = "*"

[feature.ambertools.dependencies]
ambertools = "*"

[feature.openeye]
channels = ["openeye", "conda-forge"]
dependencies = { openeye-toolkits = "*" }

[feature.packmol.dependencies]
packmol = ">=20"

[feature.cu130.dependencies]
cuda-version = "==13.0"

[feature.py312.dependencies]
python = "3.12.*"

[feature.test.pypi-dependencies]
pytest = "*"
pytest-cov = "*"
pytest-xdist = "*"
pytest-mock = "*"
pytest-randomly = "*"

[feature.typing.pypi-dependencies]
mypy = "*"
types-PyYAML = "*"
types-requests = "*"
