[workspace]
name = "tyff"
channels = [ "conda-forge"]
platforms = [ "linux-64", "osx-arm64" ]

[tasks]
run_mypy = "python -m mypy -p 'tyff'"
run_tests = {
    cmd = "python -m pytest --durations=10 --cov=tyff --cov-config=pyproject.toml --cov-append --cov-report=xml --color=yes tyff/_tests",
    env = {OPENMM_DEFAULT_PLATFORM="CPU"}
}

[pypi-dependencies]
pydantic = "*"
pyyaml = "*"
numpy = "*"
setuptools_scm = "*"
distributed = "*"
openmm = "==8.4.*"
rdkit = "==2023.*"
sqlmodel = "*"
dask = "*"
dask-jobqueue = "*"
dask-kubernetes = "*"
rdkit-stubs = "*"
parsl = "*"
rich = "*"
tyff = { path = ".", editable = true }

[dependencies]
openmm = "8.4.*" # need to help Pixi, since conda solve constraints PyPI solve
openff-toolkit = "0.18.*"
openff-interchange = "0.5.*"
openff-nagl-base = "*"
openff-nagl-models = "*"
openmmtools = "*"
pytorch = "*"
smee = "*"
descent = "*"
# shims
pyarrow = "20.*"
rdkit = "2023.*"

[environments]
py312 = [ "py312", "test", "typing" ]
py312openeye = [ "py312", "openeye", "test", "typing" ]
dev = [ "py312", "openeye", "test", "typing", "dev" ]

[feature.dev.dependencies]
openff-packmol = "0.1.*"
openff-evaluator-base = "*"
pymol-open-source = "*"

[feature.dev.pypi-dependencies]
pre-commit = "*"
jupyterlab = "*"
ipython = "*"
ipdb = "*"
ruff = "*"

[feature.openeye]
channels = [ "openeye", "conda-forge" ]
dependencies = { openeye-toolkits = "*" }

[feature.py312.dependencies]
python = "3.12.*"

[feature.test.pypi-dependencies]
pytest = "*"
pytest-cov = "*"
pytest-xdist = "*"
pytest-randomly = "*"

[feature.typing.pypi-dependencies]
mypy = "*"
types-PyYAML = "*"
types-requests = "*"
