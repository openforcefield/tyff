[workspace]
name = "tyff"
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64"]

[tasks]
run_mvp = "python examples/mvp/run.py"
run_mypy = "python -m mypy -p 'tyff'"
run_tests = { cmd = "python -m pytest -n logical tyff/_tests", env = { OPENMM_DEFAULT_PLATFORM = "CPU" } }
run_gpu_tests = "python -m pytest -n 1 --run-gpu -m gpu tyff/_tests --color=no"
dev_tests = "python -m pytest -s -x --pdb --lf tyff/_tests"

[dependencies]
# conda-only dependencies
openff-toolkit = "*"
pydantic-units = "*"
NNPOps = "*"
# probably optional-ish below here
openff-packmol = "0.1.*"
openff-evaluator-base = "*"
# shims / constraints to help solver
python = ">=3.12"  # shim?
pyarrow = "20.*"
bokeh = "3.9.*"
filelock = "<4"  # parsl stuck on 3.x
sqlalchemy = ">=2.0.14,<2.1.0"
datasets = "4.*"  # can probably remove when pyarrow >20
networkx = "<3.3"  # shim for parsl[visualization]
pandas = "<3"

[pypi-dependencies]
# python = ">=3.12"  # shim?
pydantic = "*"
pyyaml = "*"
numpy = "*"
setuptools_scm = "*"
openmm = "*"
symengine = "*"
rdkit = "*"
sqlmodel = "*"
rdkit-stubs = "*"
parsl = { version = "==2026.*", extras = ["monitoring", "visualization"] }
rich = "*"
tyff = { path = ".", editable = true }
# probably optional-ish below here
jupyter = "*"
nbconvert = "*"
tensorboard = "*"
tensorboardx = "*"
uncertainties = "*"
matplotlib = "*"
panel = "*"

[environments]
py312amber = ["py312", "ambertools", "test", "typing"]
py312openeye = ["py312", "openeye", "packmol", "test", "typing"]
hpc3 = ["py312", "cu130", "openeye", "packmol"]
# the AMI we use seems to have 12.2 installed, this is custom for that situation
gpu = ["py312", "cu122", "test", "openeye", "packmol"]

[environments.dev]
features = ["py312", "openeye", "test", "typing", "dev"]

[environments.dev.dependencies]
pymol-open-source = ">=3.1.0,<4"

[feature.dev.dependencies]
# these PyPI builds are marked as pre-release only for some reason
pymol-open-source = "*"

[feature.dev.pypi-dependencies]
pre-commit = "*"
jupyterlab = "*"
ipython = "*"
ipdb = "*"
ruff = "*"

[feature.ambertools.dependencies]
ambertools = "*"

[feature.openeye]
channels = ["openeye", "conda-forge"]
dependencies = { openeye-toolkits = "*" }

[feature.packmol.dependencies]
packmol = ">=20"

[feature.cu130.dependencies]
cuda-version = "==13.0"

[feature.cu122.dependencies]
cuda-version = "==12.2"

[feature.py312.dependencies]
python = "3.12.*"

[feature.test.pypi-dependencies]
pytest = ">=9.2"
pytest-cov = "*"
pytest-xdist = "*"
pytest-mock = "*"
pytest-randomly = "*"

[feature.typing.pypi-dependencies]
mypy = "*"
types-PyYAML = "*"
types-requests = "*"
